<li>
  <div class="flex items-center py-2 px-3 rounded-lg hover:bg-gray-50 transition-colors"
       [style.padding-left.px]="indentation">
    @if (hasChildren) {
      <button
        type="button"
        class="mr-2 w-5 h-5 flex items-center justify-center rounded hover:bg-gray-200 transition-colors"
        (click)="toggleExpanded()">
        <svg class="w-3 h-3 text-gray-500 transition-transform" [class.rotate-90]="isExpanded()" fill="currentColor" viewBox="0 0 20 20">
          <path d="M6 6L14 10L6 14V6Z"/>
        </svg>
      </button>
    } @else {
      <span class="w-5 h-5 mr-2"></span>
    }
    <span class="text-sm font-medium text-gray-900">{{ node().name }}</span>
    @if (node().description) {
      <span class="ml-2 text-xs text-gray-500">- {{ node().description }}</span>
    }
  </div>
  @if (isExpanded() && hasChildren) {
    <ul class="space-y-1">
      @for (child of node().children; track child.id) {
        <app-category-tree-node [node]="child" />
      }
    </ul>
  }
</li>
