<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" (click)="onBackdropClick($event)">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-2">{{ title() }}</h3>
    <p class="text-gray-600 mb-6">{{ message() }}</p>
    <div class="flex justify-end gap-3">
      <button
        type="button"
        class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors"
        (click)="cancel.emit()">
        Cancel
      </button>
      <button
        type="button"
        class="px-4 py-2 rounded-lg bg-danger text-white hover:bg-danger-dark transition-colors"
        (click)="confirm.emit()">
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
